approval_policy = "on-request"
sandbox_mode = "workspace-write"
developer_instructions = "Follow AGENTS.md as the project authority. For Claude-equivalent permission intent, read .codex/settings.json and, when present, .codex/settings.local.json. These JSON files are compatibility records, not native Codex config. Honor their deny and ask entries as behavioral instructions using available tools, subject to user authorization and enforced host restrictions. Do not read files matching their denied Read patterns. Native command rules cover only explicit prefixes, not every Claude glob. Local allow entries do not bypass managed restrictions, sandboxing or required approvals. Do not commit, merge or push without explicit user consent. Use .codex/agents/*.toml for roles and .agents/skills discovery links for project skills. opsx commands are skills named opsx-apply, opsx-propose, opsx-explore, opsx-update, opsx-sync and opsx-archive; .codex/commands Markdown files are workflow references, not registered slash commands."
