[output]
formula_keys = ["norm_ref", "formula_id", "latex", "symbols", "expression", "cross_refs"]
norm_ref_keys = ["document", "edition", "clause", "status", "provenance"]
symbol_keys = ["id", "latex", "meaning", "unit", "kind"]
default_symbol_kind = "input"
clause_prefix = "п."
formula_prefix = "форм."
table_prefix = "табл."

[search]
similarity_threshold = 0.1

[detect]
dpi = 400
conf = 0.25
imgsz = 1024

