# Паттерны парсера нормативных документов.
# Правила описываются здесь, а не в коде (domain-agnostic, см. AGENTS.md).

[parser]
clause_re = '^\s*(\d+(?:\.\d+){1,3})\s+([А-ЯЁA-Z].*)$'
formula_num_res = ['\((\d+\.\d+)\)\s*$', '(?<!\S)\((\d+)\)\s*$']
table_ref_re = 'таблиц[еы]\s+(\d+(?:\.\d+)?)'
gost_re = 'ГОСТ(?:\s+Р)?\s+\d+(?:[.\-]\d+)*'
gde_re = '^\s*где\s'
notation_re = '^\s*([^–—]{1,40}?)\s*[–—]\s*(.+)$'
formula_notation_re = '^\s*(?:где\s+)?([^–—]{1,40}?)\s*[–—]\s*(.+)$'
formula_max_len = 120
formula_lookback = 6
notation_scan_lines = 10
synthetic_id_template = '{clause}#{index}'
formula_label = 'формула'
condition_cues = [
  "при условии что",
  "при условии",
  "при соблюдении",
  "если соблюдается условие",
  "если выполняется условие",
  "следует выполнять если",
  "следует проводить если",
  "в случае когда",
  "только если",
  "при выполнении условия",
  "соблюдены следующие условия",
  "исходя из условия",
  "допускается если",
  "применяют при условии",
  "применяется при условии",
  "при соблюдении условия",
]

