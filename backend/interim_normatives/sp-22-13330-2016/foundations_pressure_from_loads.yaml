diagram_cases:
- norm_refs:
  - document: СП 22.13330.2016
    edition: 2016 (с Изменениями N 1, 2, 3, 4, 5)
    clause: 5.6.27, figure 5.1
    status: unverified
    provenance: machine-extracted
  page: 43
  verification:
    status: human-verified
    by: Akim
    at: '2026-11-04'
    portion: P1b-1
    value_digest: c66b9c5d7f7f28a4da48ad0d4a0b169dcfc42b7d23483e22f46b60cd11840c12
    comment: 'Единицы подтверждены: e = м; unit.l = м; unit.p_min = кПа. Различие форм e < 1/6, e = 1/6,
      e > 1/6 в подписи и обозначений с l/6 на рисунке сохраняем.'
  parameter: pressure_diagram_cases
  units:
    e: m
    l: m
    p_min: kPa
  cases:
  - figure_case: б
    diagram: trapezoidal
    condition_latex: e<l/6
    edge_ordinate_latex: null
  - figure_case: в
    diagram: triangular with zero edge ordinate
    condition_latex: e=l/6
    edge_ordinate_latex: p_{min}=0
  - figure_case: г
    diagram: shortened triangular, partial detachment
    condition_latex: l/4\geq e>l/6
    edge_ordinate_latex: null
  caption_forms_as_printed:
  - e<1/6
  - e=1/6
  - e>1/6
