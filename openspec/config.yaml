schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  DEC (Design Engineer's Calculator) is a cloud web service for automating
  engineering calculations with a verified normative base (SP/GOST/SNiP), a
  transparent ("white box") calculation engine, and GOST-compliant report generation.

  Tech stack:
  - Backend: Python 3.12, FastAPI, Pydantic
  - Calculation engine: Python (NumPy/SciPy); architecture ready to hot-swap hot
    paths to C/C++ later
  - Database: PostgreSQL with full-text search (pg_trgm, GIN indexes)
  - Frontend: React + TypeScript
  - Transparent output: MathJax + React
  - Report generation: python-docx (MVP, .docx), reportlab (.pdf, later)
  - Infrastructure: Docker locally, later Yandex Cloud / VK Cloud / Cloud.ru
  - Testing: pytest (backend), Vitest + React Testing Library (frontend),
    Playwright (E2E), >= 95% branch coverage

  Domain: design engineering. Users are structural/design engineers (novice and
  experienced), norm-control specialists, and expert reviewers. The MVP domains are
  shallow foundations first and internal water supply second. Norm editions for both
  are unverified until checked against the source texts.

  Conventions:
  - Language: English for all specs, agents, skills, and commit messages.
  - Commits: Conventional Commits.
  - Branching: develop (created from main, containing the former Specs/Specs-onboarding
    work) is the integration branch; main is frozen until the MVP. Documents (the
    "no code" list in AGENTS.md) are committed directly to develop. Code goes only
    through a feature branch feature/<feature>/<zone>, where zone is backend/frontend
    (Akim) or data/ml/infra (Egor), merged into develop only when the whole feature
    is done. Before a development session, check commits on develop and its remote
    (git fetch --all), warn about important changes, and remind the developer to run
    git pull.
  - Team: three people. Two developers, Akim (frontend/backend, engine, report
    generator) and Egor (normative pipeline, NLP/RAG, DevOps, ML), and a PM who owns
    scope, pricing, and legal decisions and has no code zone. Ask which developer is
    working before development. Developer zones do not overlap except specs.
  - Readiness: `openspec validate` checks structure only; a change is ready (DOR) only
    when a `spec-reviewer` report on its current version lists no blocker and no major
    finding.
  - Lint/type checks: backend ruff + mypy; frontend eslint + tsc.
  - No ML in the calculation path (explicitly rejected). NLP/RAG auto-parsing of norms
    (collector, regex baseline parser, embeddings retrieval on CPU) is part of the MVP.
  - No code comments unless required.

# Per-artifact rules
rules:
  proposal:
    - "Keep the proposal focused on what and why; state the problem and the outcome."
    - "Include a 'Non-goals' section."
  specs:
    - "Write each requirement as 'The system SHALL ...' with at least one '#### Scenario:'."
    - "Record non-functional requirements (performance, security, accessibility) explicitly."
  design:
    - "Name the component boundary where Python hot paths can later be swapped to C/C++."
  tasks:
    - "Each task must be completable in one session."
    - "The change must name each feature, its branch and its tasks (every task with code in exactly one feature): feature/<feature>/backend or feature/<feature>/frontend (Akim), or feature/<feature>/data, feature/<feature>/ml, feature/<feature>/infra (Egor); a change with no code states that it has no branch."
    - "Include the DOR checklist and DOD/Go-No-Go criteria for the change."

# Per-operation guidance
operations:
  apply:
    guidance:
      - "Implement code on its feature branch only, never on develop/main; documents are committed directly to develop."
      - "Run lint and type checks before marking tasks complete."
  archive:
    guidance:
      - "Confirm the tester GO verdict and >= 95% branch coverage before archiving; for a change with code, every feature is merged with its GO."
      - "Confirm ui-ux-tester approval when UI changed."
